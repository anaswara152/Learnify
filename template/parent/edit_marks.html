{% extends 'parent/page.html' %}
{% load static %}

{% block title %}Edit Marks{% endblock %}

{% block content %}

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card shadow border-0 rounded-4">

                <!-- Header -->
                <div class="card-header bg-white text-center border-0 pt-4 pb-2">
                    <h4 class="fw-bold text-primary mb-1">
                        <i class="fa fa-edit me-2"></i>Edit Marks
                    </h4>
                    <div class="header-line mx-auto"></div>
                </div>

                <div class="card-body p-4">

                    <form method="post">
                        {% csrf_token %}

                        <!-- Student Info -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Student</label>
                            <input type="text" class="form-control"
                                   value="{{ mark.student.user.first_name }}"
                                   readonly>
                        </div>

                        <!-- Subject Info -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Subject</label>
                            <input type="text" class="form-control"
                                   value="{{ mark.subject.subjectname }}"
                                   readonly>
                        </div>

                        <!-- Marks Obtained -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Marks Obtained</label>
                            <input type="number"
                                   name="marks_obtained"
                                   value="{{ mark.marks_obtained }}"
                                   class="form-control"
                                   min="0"
                                   required>
                        </div>

                        <!-- Total Marks -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Total Marks</label>
                            <input type="number"
                                   name="total_marks"
                                   value="{{ mark.total_marks }}"
                                   class="form-control"
                                   min="1"
                                   required>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'view_marks' %}" 
                               class="btn btn-outline-secondary rounded-pill px-4">
                               Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary rounded-pill px-4">
                                Update Marks
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<style>
    body {
        background-color: #f4f6f9;
    }

    .header-line {
        width: 60px;
        height: 3px;
        background: linear-gradient(to right, #0d6efd, #6610f2);
        border-radius: 10px;
    }

    .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
        border-color: #0d6efd;
    }
</style>

{% endblock %}
