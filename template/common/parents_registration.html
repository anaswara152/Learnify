{% extends 'common/page.html' %}
{% block content %}

<style>
.page-content{
    padding-bottom:90px;
}

.registration-card{
    border:none;
    border-radius:15px;
}

.registration-card .card-header{
    background:#fff;
    border:none;
    padding:30px 30px 10px;
}

.registration-card .card-body{
    padding:30px;
}

.form-control{
    height:48px;
    border-radius:10px;
}

textarea.form-control{
    height:110px;
    resize:none;
}

.form-control:focus{
    box-shadow:none;
    border-color:#007bff;
}

.btn-register{
    border-radius:10px;
    padding:12px;
    font-size:17px;
    font-weight:600;
}
</style>

<div class="container py-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">

            <div class="card registration-card shadow-lg">

                <div class="card-header text-center">
                    <h4 class="text-primary mb-0">Parent Registration</h4>
                </div>

                <div class="card-body">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Personal Information -->
                        <h6 class="text-muted font-weight-bold mb-3">
                            Personal Information
                        </h6>

                        <div class="form-row">

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="first_name"
                                       name="first_name"
                                       placeholder="First Name"
                                       required>
                            </div>

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="last_name"
                                       name="last_name"
                                       placeholder="Last Name"
                                       required>
                            </div>

                        </div>

                        <div class="form-group text-center">

                            <label class="font-weight-bold d-block mb-3">
                                Gender
                            </label>

                            <div class="btn-group btn-group-toggle" data-toggle="buttons">

                                <label class="btn btn-outline-primary">
                                    <input type="radio"
                                           name="gender"
                                           value="Male"
                                           required>

                                    <i class="fas fa-mars mr-1"></i>
                                    Male
                                </label>

                                <label class="btn btn-outline-primary">
                                    <input type="radio"
                                           name="gender"
                                           value="Female"
                                           required>

                                    <i class="fas fa-venus mr-1"></i>
                                    Female
                                </label>

                            </div>

                        </div>

                        <hr>

                        <!-- Account Information -->
                        <h6 class="text-muted font-weight-bold mb-3">
                            Account Information
                        </h6>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Choose Username"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Email Address"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Create Password"
                                   required>
                        </div>

                        <hr>

                        <!-- Contact Information -->
                        <h6 class="text-muted font-weight-bold mb-3">
                            Contact Information
                        </h6>

                        <div class="form-group">
                            <textarea class="form-control"
                                      id="address"
                                      name="address"
                                      placeholder="Residential Address"
                                      required></textarea>
                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   placeholder="Phone Number"
                                   pattern="[0-9]{10}"
                                   title="Phone number must be 10 digits"
                                   required>
                        </div>

                        <hr>

                        <!-- Professional Information -->
                        <h6 class="text-muted font-weight-bold mb-3">
                            Professional Information
                        </h6>

                        <div class="form-group">
                            <select class="form-control"
                                    id="occupation"
                                    name="occupation"
                                    required>

                                <option value="">Select Occupation</option>
                                <option value="Teacher">Teacher</option>
                                <option value="Doctor">Doctor</option>
                                <option value="Engineer">Engineer</option>
                                <option value="Nurse">Nurse</option>
                                <option value="Driver">Driver</option>
                                <option value="Business">Business</option>
                                <option value="Shop Owner">Shop Owner</option>
                                <option value="Farmer">Farmer</option>
                                <option value="Housewife">Housewife</option>
                                <option value="Government Job">Government Job</option>
                                <option value="Private Job">Private Job</option>
                                <option value="Self-employed">Self-employed</option>
                                <option value="Retired">Retired</option>
                                <option value="Unemployed">Unemployed</option>
                            </select>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block btn-lg btn-register">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
