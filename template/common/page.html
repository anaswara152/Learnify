<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <title>Learnify - Online Education</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries -->
    <link href="{% static 'Edukate-1.0.0/lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="{% static 'Edukate-1.0.0/css/style.css' %}" rel="stylesheet">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f8f9fa;">

<!-- Topbar -->
<div class="container-fluid bg-dark">
    <div class="row py-2 px-lg-5">
        <div class="col-lg-6 text-center text-lg-left mb-2 mb-lg-0">
            <div class="d-inline-flex align-items-center text-white">
                <small><i class="fa fa-phone-alt mr-2"></i>+012 345 6789</small>
                <small class="px-3">|</small>
                <small><i class="fa fa-envelope mr-2"></i>learnonlearnify@gmail.com</small>
            </div>
        </div>
        <div class="col-lg-6 text-center text-lg-right">
            <div class="d-inline-flex align-items-center">
                <a class="text-white px-2" href="#"><i class="fab fa-facebook-f"></i></a>
                <a class="text-white px-2" href="#"><i class="fab fa-twitter"></i></a>
                <a class="text-white px-2" href="#"><i class="fab fa-linkedin-in"></i></a>
                <a class="text-white px-2" href="#"><i class="fab fa-instagram"></i></a>
                <a class="text-white pl-2" href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>
</div>

<!-- Navbar -->
<div class="container-fluid p-0">
    <nav class="navbar navbar-expand-lg bg-white navbar-light py-3 px-lg-5 fixed-top shadow-sm">
        <a href="{% url 'home' %}" class="navbar-brand ml-lg-3">
            <h1 class="m-0 text-uppercase text-primary">
                <i class="fa fa-book-reader mr-3"></i>Learnify
            </h1>
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end px-lg-3" id="navbarCollapse">

            <!-- Right side buttons -->
            <div class="d-flex align-items-center d-none d-lg-flex">

                <a href="{% url 'home' %}" class="btn btn-outline-primary py-2 px-3 mr-2">
                    Home
                </a>

                <div class="dropdown mr-2">
                    <button class="btn btn-outline-primary dropdown-toggle py-2 px-3"
                            data-toggle="dropdown">
                        Sign Up
                    </button>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a href="{% url 'student_register' %}" class="dropdown-item">Student</a>
                        <a href="{% url 'teacher_register' %}" class="dropdown-item">Teacher</a>
                        <a href="{% url 'parents_register' %}" class="dropdown-item">Parent</a>
                    </div>
                </div>

                <a href="{% url 'login_users' %}" class="btn btn-primary py-2 px-4">
                    Sign In
                </a>

            </div>
        </div>
    </nav>
</div>

<!-- Page Content -->
<div style="margin-top:120px;">
    {% block content %}
    {% endblock %}
</div>

<!-- Footer -->
<div class="container-fluid bg-light text-center text-muted py-2 mt-5 fixed-bottom">
    <small>
        © 2026 <span class="text-primary">Learnify</span>. All Rights Reserved.
    </small>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'Edukate-1.0.0/lib/owlcarousel/owl.carousel.min.js' %}"></script>
<script src="{% static 'Edukate-1.0.0/js/main.js' %}"></script>

</body>
</html>
