{% extends 'common/page.html'  %}
{% block content %}

<style>
  .page-content {
    padding-bottom: 90px;
  }
</style>

<body class="bg-light">

<div class="container py-2 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-10">

      <div class="card shadow-lg">
        <div class="text-center pt-2">
          <h4 class="fw-semibold text-primary">Student Registration</h4>
        </div>

        <div class="card-body p-4">

          <!-- Django Messages -->
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}

           
            <div class="row g-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" required>
                  <label for="first_name">First Name</label>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last Name" required>
                  <label for="last_name">Last Name</label>
                </div>
              </div>
            </div>

            
            <div class="form-floating mt-3">
              <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
              <label for="username">Username</label>
            </div>

            
            <div class="form-floating mt-3">
              <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
              <label for="email">Email</label>
            </div>

            
            <div class="form-floating mt-3">
              <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
              <label for="password">Password</label>
            </div>

            
            <div class="mt-3 text-center">
              <label class="form-label d-block mb-2">Gender</label>
              <div class="d-flex justify-content-center gap-4" >
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required >
                  <label class="form-check-label" for="male">Male</label>
                </div>

                <div class="form-check" >
                  <input class="form-check-input" type="radio" name="gender" id="female" value="Female"  required>
                  <label class="form-check-label" for="female">Female</label>
                </div>
              </div>
            </div>

            
            <div class="form-floating mt-3">
              <select id="class_level" name="class_level" class="form-select" required>
                <option value="">Select Class</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="sslc">Class 10</option>
                <option value="plusone">Class 11</option>
                <option value="plustwo">Class 12</option>
              </select>
              <label for="class_level">Class Level</label>
            </div>

          
       <div class="form-floating mt-3">
  <input type="text" name="parent_name" class="form-control" placeholder="Parent Name" required>
  <label>Parent Name</label>
</div>

            
            <div class="form-floating mt-3">
  <select name="subjects" class="form-select" multiple style="height: 150px;" required>
    {% for s in subject %}
      <option value="{{ s.id }}">{{ s.subjectname }}</option>
    {% endfor %}
  </select>
  <label>Select Subjects (Ctrl + Click)</label>
</div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg">Register</button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
