{% extends 'common/page.html' %}
{% block content %}

<style>
.page-content{
    padding-bottom:90px;
}
</style>

<div class="container py-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">

            <div class="card shadow-lg">

                <div class="card-header bg-white border-0 text-center">
                    <h4 class="text-primary mb-0">Student Registration</h4>
                </div>

                <div class="card-body">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="form-row">

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="first_name"
                                       name="first_name"
                                       placeholder="First Name"
                                       required>
                            </div>

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="last_name"
                                       name="last_name"
                                       placeholder="Last Name"
                                       required>
                            </div>

                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Username"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Email Address"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Password"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold d-block">
                                Gender
                            </label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       id="male"
                                       name="gender"
                                       value="Male"
                                       required>

                                <label class="form-check-label" for="male">
                                    Male
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       id="female"
                                       name="gender"
                                       value="Female">

                                <label class="form-check-label" for="female">
                                    Female
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <select class="form-control"
                                    id="class_level"
                                    name="class_level"
                                    required>

                                <option value="">Select Class</option>
                                <option value="1">Class 1</option>
                                <option value="2">Class 2</option>
                                <option value="3">Class 3</option>
                                <option value="4">Class 4</option>
                                <option value="5">Class 5</option>
                                <option value="6">Class 6</option>
                                <option value="7">Class 7</option>
                                <option value="8">Class 8</option>
                                <option value="9">Class 9</option>
                                <option value="sslc">Class 10</option>
                                <option value="plusone">Class 11</option>
                                <option value="plustwo">Class 12</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="parent_name"
                                   name="parent_name"
                                   placeholder="Parent Name"
                                   required>
                        </div>

                        <div class="form-group">
                            <select class="form-control"
                                    id="subjects"
                                    name="subjects"
                                    multiple
                                    size="6"
                                    required>

                                {% for s in subject %}
                                    <option value="{{ s.id }}">
                                        {{ s.subjectname }}
                                    </option>
                                {% endfor %}

                            </select>

                            <small class="text-muted">
                                Hold Ctrl (Windows) or Cmd (Mac) to select multiple subjects.
                            </small>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block btn-lg">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
