{% extends 'common/page.html' %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card shadow-sm border-0">
                
                <!-- Header -->
                <div class="text-center pt-4">
                    <h4 class="fw-semibold text-primary">Login</h4>
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-danger text-center">
                                {{ msg }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" class="text-center">
                        {% csrf_token %}

                        <input type="text"
                               class="form-control mb-3 mx-auto bg-light"
                               style="max-width: 320px;"
                               name="username"
                               placeholder="Username"
                               required>

                        <input type="password"
                               class="form-control mb-3 mx-auto bg-light"
                               style="max-width: 320px;"
                               name="password"
                               placeholder="Password"
                               required>

                        <button type="submit"
                                class="btn btn-primary px-5 mt-2">
                            Login
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="{% url 'forgot_password_for_all' %}"
                           class="text-decoration-none text-primary">
                            Forgot Password?
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa; /* light page background */
    }
    .card {
        border-radius: 14px;
        background-color: #ffffff;
    }
    .form-control {
        border-radius: 8px;
    }
</style>
{% endblock %}
