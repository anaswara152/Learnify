{% extends 'common/page.html'  %}
{% block content %}

<style>
  .page-content {
    padding-bottom: 90px;
  }
</style>

<body class="bg-light">

<div class="container py-2 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-10">

      <div class="card shadow-lg">
        <div class="text-center pt-2">
          <h4 class="fw-semibold text-primary">Teacher Registration</h4>
        </div>
        <div class="card-body p-4">
                 {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            
            <div class="row g-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" required>
                  <label for="first_name">First Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last Name" required>
                  <label for="last_name">Last Name</label>
                </div>
              </div>
            </div>

            
            <div class="form-floating mt-3">
              <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
              <label for="username">Username</label>
            </div>

           
            <div class="form-floating mt-3">
              <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
              <label for="email">Email</label>
            </div>

            
            <div class="form-floating mt-3">
              <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
              <label for="password">Password</label>
            </div>

            <div class="mt-3 text-center">
              <label class="form-label d-block mb-2">Gender</label>
              <div class="d-flex justify-content-center gap-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
                  <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="gender" id="female" value="Female" required>
                  <label class="form-check-label" for="female">Female</label>
                </div>
              </div>
            </div>

           
            <div class="form-floating mt-3">
              <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone" required pattern="[0-9]{10}" title="Phone number must be 10 digits">
              <label for="phone">Phone</label>
            </div>

          
          <div class="form-floating mt-3">
            <select name="qualification" id="qualification" class="form-select" required>
              <option value="">Select Qualification</option>
              <option value="B.Ed">B.Ed</option>
              <option value="M.Ed">M.Ed</option>
              <option value="D.El.Ed / TTC">D.El.Ed / TTC</option>
              <option value="B.Sc">B.Sc</option>
              <option value="M.Sc">M.Sc</option>
              <option value="B.A">B.A</option>
              <option value="M.A">M.A</option>
              <option value="B.Com / M.Com">B.Com / M.Com</option>
              <option value="BCA / MCA">BCA / MCA</option>
              <option value="B.Tech / M.Tech">B.Tech / M.Tech</option>
            </select>
            <label for="qualification">Qualification</label>
          </div>


        
            <div class="form-floating mt-3">
              <input type="number" id="experience" name="experience" class="form-control" placeholder="Experience" required>
              <label for="experience">Experience (Years)</label>
            </div>

            <div class="form-floating mt-3">
              <input type="file" id="id_card" name="id_card" class="form-control" required>
              <label for="">ID Card</label>

            </div>
            <div class="form form-floating mt-3">
              <input type="file" name="certificates" id="certificates" class="form-control" required>
              <label for="">Certificate</label>

            </div>
            <div class="form-floating mt-3">
              <input type="file" id="profile_picture" name="profile_picture" class="form-control" required>
              <label for="">ProfilePicture</label>

            </div>
        
            <div class="form-floating mt-3">
          <select name="subjects" class="form-select" multiple style="height: 150px;" required>
            {% for s in teachersub %}
              <option value="{{ s.id }}">{{ s.subjectname }}</option>
            {% endfor %}
          </select>
          <label>Select Subjects (Ctrl + Click)</label>
        </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg">Register</button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>


{% endblock %}
