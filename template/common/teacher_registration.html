{% extends 'common/page.html' %}
{% block content %}

<style>
.page-content{
    padding-bottom:90px;
}

.registration-card{
    border:none;
    border-radius:15px;
}

.registration-card .card-header{
    background:#fff;
    border:none;
    padding:30px 30px 10px;
}

.registration-card .card-body{
    padding:30px;
}

.form-control,
.custom-file-label{
    height:48px;
    border-radius:8px;
}

.custom-file-label{
    line-height:34px;
}

textarea.form-control{
    height:auto;
}

.section-title{
    font-size:15px;
    font-weight:600;
    color:#495057;
    margin-bottom:12px;
}

.btn-register{
    border-radius:8px;
    padding:12px;
    font-size:17px;
    font-weight:600;
}

.subject-box{
    height:170px;
}

.form-control:focus,
.custom-file-input:focus~.custom-file-label{
    box-shadow:none;
    border-color:#007bff;
}

.card-footer{
    background:#fff;
    border:none;

    
}

.custom-file-label{
    border-radius:10px;
    height:48px;
    line-height:32px;
    cursor:pointer;
}

.custom-file-input:focus~.custom-file-label{
    border-color:#007bff;
    box-shadow:none;
}

.subject-box{
    min-height:170px;
    border-radius:10px;
}

.btn-register{
    border-radius:10px;
    padding:12px;
    font-size:17px;
    font-weight:600;
}

.form-control{
    border-radius:10px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#007bff;
}
</style>
<div class="container py-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">

            <div class="card shadow-lg">

                <div class="card-header bg-white border-0 text-center">
                    <h4 class="text-primary mb-0">Teacher Registration</h4>
                </div>

                <div class="card-body">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="form-row">

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="first_name"
                                       name="first_name"
                                       placeholder="First Name"
                                       required>
                            </div>

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="last_name"
                                       name="last_name"
                                       placeholder="Last Name"
                                       required>
                            </div>

                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Username"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Email Address"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Password"
                                   required>
                        </div>

<div class="form-group text-center">

    <label class="font-weight-bold d-block mb-3">
        Gender
    </label>

    <div class="btn-group btn-group-toggle" data-toggle="buttons">

        <label class="btn btn-outline-primary">
            <input type="radio" name="gender" value="Male" required>
            <i class="fas fa-mars mr-1"></i> Male
        </label>

        <label class="btn btn-outline-primary">
            <input type="radio" name="gender" value="Female" required>
            <i class="fas fa-venus mr-1"></i> Female
        </label>

    </div>

</div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   placeholder="Phone Number"
                                   pattern="[0-9]{10}"
                                   title="Phone number must be 10 digits"
                                   required>
                        </div>

                        <div class="form-group">
                            <select class="form-control"
                                    name="qualification"
                                    id="qualification"
                                    required>

                                <option value="">Select Qualification</option>
                                <option value="B.Ed">B.Ed</option>
                                <option value="M.Ed">M.Ed</option>
                                <option value="D.El.Ed / TTC">D.El.Ed / TTC</option>
                                <option value="B.Sc">B.Sc</option>
                                <option value="M.Sc">M.Sc</option>
                                <option value="B.A">B.A</option>
                                <option value="M.A">M.A</option>
                                <option value="B.Com / M.Com">B.Com / M.Com</option>
                                <option value="BCA / MCA">BCA / MCA</option>
                                <option value="B.Tech / M.Tech">B.Tech / M.Tech</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <input type="number"
                                   class="form-control"
                                   id="experience"
                                   name="experience"
                                   placeholder="Experience (Years)"
                                   required>
                        </div>
<div class="form-group">


    <div class="custom-file">
        <input type="file"
               class="custom-file-input"
               id="id_card"
               name="id_card"
               required>

        <label class="custom-file-label" for="id_card">
            <i class="fas fa-id-card mr-2"></i>
            Upload ID Card
        </label>
    </div>
</div>

<div class="form-group">


    <div class="custom-file">
        <input type="file"
               class="custom-file-input"
               id="certificates"
               name="certificates"
               required>

        <label class="custom-file-label" for="certificates">
            <i class="fas fa-certificate mr-2"></i>
            Upload Certificate
        </label>
    </div>
</div>
<div class="form-group">


    <div class="custom-file">
        <input type="file"
               class="custom-file-input"
               id="profile_picture"
               name="profile_picture"
               accept="image/*"
               required>

        <label class="custom-file-label" for="profile_picture">
            <i class="fas fa-camera mr-2"></i>
            Choose Profile Photo
        </label>
    </div>
</div>

                        <div class="form-group">
                            <select class="form-control"
                                    id="subjects"
                                    name="subjects"
                                    multiple
                                    size="6"
                                    required>

                                {% for s in teachersub %}
                                    <option value="{{ s.id }}">
                                        {{ s.subjectname }}
                                    </option>
                                {% endfor %}

                            </select>

                            <small class="text-muted">
                                Hold Ctrl (Windows) or Cmd (Mac) to select multiple subjects.
                            </small>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block btn-lg">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>
<script>
  $('.custom-file-input').on('change', function () {
    var fileName = $(this).val().split('\\').pop();
    $(this).next('.custom-file-label').html(fileName);
});
</script>
{% endblock %}
