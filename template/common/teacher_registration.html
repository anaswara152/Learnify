{% extends 'common/page.html' %}
{% block content %}

<style>
.page-content{
    padding-bottom:90px;
}
</style>

<div class="container py-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">

            <div class="card shadow-lg">

                <div class="card-header bg-white border-0 text-center">
                    <h4 class="text-primary mb-0">Teacher Registration</h4>
                </div>

                <div class="card-body">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="form-row">

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="first_name"
                                       name="first_name"
                                       placeholder="First Name"
                                       required>
                            </div>

                            <div class="form-group col-md-6">
                                <input type="text"
                                       class="form-control"
                                       id="last_name"
                                       name="last_name"
                                       placeholder="Last Name"
                                       required>
                            </div>

                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Username"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Email Address"
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Password"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold d-block">
                                Gender
                            </label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="male"
                                       value="Male"
                                       required>

                                <label class="form-check-label" for="male">
                                    Male
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="female"
                                       value="Female">

                                <label class="form-check-label" for="female">
                                    Female
                                </label>
                            </div>

                        </div>

                        <div class="form-group">
                            <input type="text"
                                   class="form-control"
                                   id="phone"
                                   name="phone"
                                   placeholder="Phone Number"
                                   pattern="[0-9]{10}"
                                   title="Phone number must be 10 digits"
                                   required>
                        </div>

                        <div class="form-group">
                            <select class="form-control"
                                    name="qualification"
                                    id="qualification"
                                    required>

                                <option value="">Select Qualification</option>
                                <option value="B.Ed">B.Ed</option>
                                <option value="M.Ed">M.Ed</option>
                                <option value="D.El.Ed / TTC">D.El.Ed / TTC</option>
                                <option value="B.Sc">B.Sc</option>
                                <option value="M.Sc">M.Sc</option>
                                <option value="B.A">B.A</option>
                                <option value="M.A">M.A</option>
                                <option value="B.Com / M.Com">B.Com / M.Com</option>
                                <option value="BCA / MCA">BCA / MCA</option>
                                <option value="B.Tech / M.Tech">B.Tech / M.Tech</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <input type="number"
                                   class="form-control"
                                   id="experience"
                                   name="experience"
                                   placeholder="Experience (Years)"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">
                                ID Card
                            </label>
                            <input type="file"
                                   class="form-control-file"
                                   id="id_card"
                                   name="id_card"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">
                                Certificate
                            </label>
                            <input type="file"
                                   class="form-control-file"
                                   id="certificates"
                                   name="certificates"
                                   required>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">
                                Profile Picture
                            </label>
                            <input type="file"
                                   class="form-control-file"
                                   id="profile_picture"
                                   name="profile_picture"
                                   required>
                        </div>

                        <div class="form-group">
                            <select class="form-control"
                                    id="subjects"
                                    name="subjects"
                                    multiple
                                    size="6"
                                    required>

                                {% for s in teachersub %}
                                    <option value="{{ s.id }}">
                                        {{ s.subjectname }}
                                    </option>
                                {% endfor %}

                            </select>

                            <small class="text-muted">
                                Hold Ctrl (Windows) or Cmd (Mac) to select multiple subjects.
                            </small>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block btn-lg">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
