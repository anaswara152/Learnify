{% extends 'teacher/page.html' %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow p-4">
                <h4 class="text-center mb-4 text-primary">
                    Upload Recorded Class
                </h4>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Subject -->
                    <div class="form-group mb-3">
                        <label class="form-label">Subject</label>
                        <select name="subject" class="form-control" required>
                            <option value="">Select Subject</option>
                            {% for s in subjects %}
                                <option value="{{ s.id }}">{{ s.subjectname }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Class Title -->
                    <div class="form-group mb-3">
                        <label class="form-label">Class Title</label>
                        <input type="text" name="title" 
                               class="form-control" 
                               placeholder="Enter class title" required>
                    </div>

                    <!-- Class Level -->
                    <div class="form-group mb-3">
                        <label class="form-label">Class</label>
                        <select name="class_level" class="form-control" required>
                            <option value="">Select Class</option>
                            {% for i in "123456789101112"|make_list %}
                                <option value="{{ i }}">{{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Upload Video -->
                    <div class="form-group mb-4">
                        <label class="form-label">Upload Video</label>
                        <input type="file" name="video" 
                               class="form-control" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-upload me-2"></i> Upload Class
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
