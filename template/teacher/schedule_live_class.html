{% extends 'teacher/page.html' %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow p-4">
                <h4 class="text-center mb-4 text-primary">Schedule Live Class</h4>

                <form method="post">
                    {% csrf_token %}

                    <!-- Subject -->
                    <div class="form-group">
                        <label>Subject</label>
                        <select name="subject" class="form-control" required>
                            <option value="">Select Subject</option>
                            {% for s in subjects %}
                                <option value="{{ s.id }}">{{ s.subjectname }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>

                    <!-- Time -->
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>

                    <!-- Class Level -->
                    <div class="form-group">
                        <label>Class</label>
                        <select name="class_level" class="form-control" required>
                            <option value="">Select Class</option>
                            {% for i in "123456789101112"|make_list %}
                                <option value="{{ i }}">{{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Meeting Link -->
                    <div class="form-group">
                        <label>Meeting Link</label>
                        <input type="url" name="link" class="form-control" placeholder="https://example.com" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-video mr-2"></i> Schedule Live Class
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
