{% extends 'admin/page.html' %}

{% block content %}
<div class="container py-2 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card shadow-sm border-0">

                <!-- Header -->
                <div class="text-center pt-4">
                    <h4 class="fw-semibold text-primary">Add Subject Fee</h4>
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-danger text-center">
                                {{ msg }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" class="text-center">
                        {% csrf_token %}

                        <!-- Student -->
                        <label class="form-label fw-semibold">Select Student</label>
<select name="student" id="student"
        class="form-control mb-3 mx-auto bg-light"
        style="max-width: 320px;" required>

    <option value="">-- Select Student --</option>

    {% for student in students %}
        <option value="{{ student.id }}"
                data-subjects="{% for sub in student.subjects.all %}{{ sub.id }}:{{ sub.subjectname }}|{% endfor %}">
            {{ student.user.first_name }} {{ student.user.last_name }}
        </option>
    {% endfor %}
</select>
                        <!-- Subject -->
                        <label class="form-label fw-semibold">Select Subject</label>
                       <select name="subject" id="subject"
        class="form-control mb-3 mx-auto bg-light"
        style="max-width: 320px;" required>
    <option value="">-- Select Subject --</option>
</select>

                        <!-- Amount -->
                        <label class="form-label fw-semibold">Amount Due</label>
                        <input type="number" name="amount_due"
                               class="form-control mb-3 mx-auto bg-light"
                               style="max-width: 320px;" step="0.01" required>

                        <!-- Due Date -->
                        <label class="form-label fw-semibold">Due Date</label>
                        <input type="date" name="due_date"
                               class="form-control mb-3 mx-auto bg-light"
                               style="max-width: 320px;" required>

                        <button type="submit"
                                class="btn btn-primary px-5 mt-2">
                            Add Fee
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a href="{% url 'view_fees_admin' %}"
                           class="text-decoration-none text-primary">
                            Back to Fee List
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
    }
    .card {
        border-radius: 14px;
        background-color: #ffffff;
    }
    .form-control {
        border-radius: 8px;
    }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {

    let studentDropdown = document.getElementById("student");
    let subjectDropdown = document.getElementById("subject");

    studentDropdown.addEventListener("change", function () {

        subjectDropdown.innerHTML = '<option value="">-- Select Subject --</option>';

        let selectedOption = this.options[this.selectedIndex];
        let subjectsData = selectedOption.getAttribute("data-subjects");

        if (subjectsData) {
            let subjects = subjectsData.split("|");

            subjects.forEach(function (item) {
                if (item) {
                    let parts = item.split(":");
                    let id = parts[0];
                    let name = parts[1];

                    let option = document.createElement("option");
                    option.value = id;
                    option.text = name;

                    subjectDropdown.appendChild(option);
                }
            });
        }
    });

});
</script>
{% endblock %}
