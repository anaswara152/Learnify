{% extends 'student/page.html' %}
{% load static %}

{% block title %}Submit Homework{% endblock %}

{% block content %}

<div class="container py-5" style="margin-top:100px; max-width:600px;">

    <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h4 class="text-primary font-weight-bold">Submit Homework</h4>
                <p class="text-muted mb-0">{{ homework.title }}</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label class="font-weight-bold">Upload Your Answer</label>
                    <input type="file" 
                           name="answer" 
                           class="form-control" 
                           required>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" 
                            class="btn btn-primary px-4 rounded-pill">
                        Submit Answer
                    </button>
                </div>
            </form>

        </div>
    </div>

</div>

{% endblock %}
